notes: >-
  5tratumOS opens a Cortex-branded portal image (APP_HOST: app, port 8080)
  from ghcr.io/cortex-repo/cortex-monitoring because Grafana does not embed
  cleanly. Grafana is published on 3000. Stack adds VictoriaMetrics/Logs,
  Alloy, Node Exporter, Alertmanager. Node Exporter uses read-only host mounts,
  pid: host, root user, and D-Bus for systemd. Alloy mounts /var/run/docker.sock
  for container logs and read-only
  /var/lib/5tratumos/apps/axebch/data/pool/www for ckpool.log + recursive
  *.sharelog (tail_from_end). Fan/PSU panels need host hwmon or power_supply
  sysfs. Grafana admin password is fixed to cortex.
