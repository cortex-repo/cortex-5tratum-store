notes: >-
  Grafana UI matches GLOBAL grafana (APP_HOST: app, port 3000). Stack adds
  VictoriaMetrics/Logs, Alloy, Node Exporter, Alertmanager. Node Exporter uses
  read-only host mounts, pid: host, root user, and D-Bus for systemd; enables
  processes/systemd/tcpstat/interrupts/ethtool collectors. Alloy mounts
  /var/run/docker.sock (runs as root) for container logs into VictoriaLogs.
  Fan/PSU panels need host hwmon or power_supply sysfs; many servers have none
  without IPMI.
