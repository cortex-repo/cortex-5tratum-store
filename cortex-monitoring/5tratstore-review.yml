notes: >-
  Grafana UI matches GLOBAL grafana (APP_HOST: app, port 33012). Stack adds
  VictoriaMetrics/Logs, Alloy, Node Exporter, Alertmanager. Node Exporter uses
  read-only host mounts and pid: host. Alloy mounts /var/run/docker.sock (runs
  as root) to collect all container logs into VictoriaLogs. Dashboard 1860
  provisioned from Grafana.com.
