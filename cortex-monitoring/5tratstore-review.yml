notes: >-
  5tratumOS opens a Python portal (APP_HOST: app, port 8080) because Grafana
  does not embed cleanly. Grafana is published on 3000. Stack adds
  VictoriaMetrics/Logs, Alloy, Node Exporter, Alertmanager. Node Exporter uses
  read-only host mounts, pid: host, root user, and D-Bus for systemd. Alloy
  mounts /var/run/docker.sock for container logs. Fan/PSU panels need host
  hwmon or power_supply sysfs.
