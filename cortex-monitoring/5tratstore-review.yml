notes: >-
  Bundled multi-service monitoring recipe for Custom Store use. Node Exporter
  requires read-only host mounts of /proc, /sys, and / (as /host/root) plus
  pid: host. No privileged mode and no Docker socket. Alloy does not mount the
  Docker socket; log pipelines to VictoriaLogs must be added by the operator.
  Maintainer lifecycle testing and rights clearance are still required before
  any GLOBAL approval.
