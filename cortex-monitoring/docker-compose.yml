# Persistent data lives under the 5tratumOS apps root:
#   /var/lib/5tratumos/apps/cortex-monitoring
# APP_DATA_DIR from the OS is honoured when set; otherwise that path is used.
services:
  app_proxy:
    environment:
      # Umbrel-style DNS name used by the OS-injected proxy on many 5tratum builds
      APP_HOST: cortex-monitoring_app_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
      PROXY_AUTH_WHITELIST: "/api/*,/apps/cortex-monitoring/api/*"

  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-cortex}
    command:
      - sh
      - -c
      - |
        install -d -o 472 -g 0 /data/grafana
        chown -R 472:0 /data/grafana
        install -d -o 1000 -g 1000 /data/victoriametrics /data/victorialogs
        chown -R 1000:1000 /data/victoriametrics /data/victorialogs
        install -d -o 65534 -g 65534 /data/alertmanager/storage
        chown -R 65534:65534 /data/alertmanager
        install -d -o 1000 -g 1000 /data/alloy/data
        chown -R 1000:1000 /data/alloy
        # Persist a recoverable copy of the initial admin password for operators
        umask 077
        printf '%s\n' "$${APP_PASSWORD}" > /data/admin-password.txt
        chown 1000:1000 /data/admin-password.txt
    volumes:
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data:/data
    security_opt:
      - no-new-privileges:true

  app:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    restart: unless-stopped
    user: "472:0"
    networks:
      default:
        aliases:
          - cortex-monitoring_app_1
          - app
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # OS APP_PASSWORD when present; otherwise a known Custom Store default
      GF_SECURITY_ADMIN_PASSWORD: ${APP_PASSWORD:-cortex}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      # Allow opening from the 5tratumOS UI (iframe / reverse proxy)
      GF_SECURITY_COOKIE_SAMESITE: disabled
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 5tratumOS serves the app UI under /apps/cortex-monitoring/
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/apps/cortex-monitoring/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LIVE_ALLOWED_ORIGINS: "*"
    volumes:
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/grafana:/var/lib/grafana
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/grafana-provisioning:/etc/grafana/provisioning:ro
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      alertmanager:
        condition: service_started

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
    restart: unless-stopped
    user: "1000:1000"
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
      - -selfScrapeInterval=30s
    volumes:
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/victoriametrics:/victoria-metrics-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    restart: unless-stopped
    user: "1000:1000"
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
    volumes:
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/victorialogs:/victoria-logs-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/alertmanager/storage:/alertmanager
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully

  alloy:
    image: grafana/alloy:v1.11.3@sha256:8c7256f412feb9f5f48f9f6f9394dc97ca887f63dea9304f347970ecc1787669
    restart: unless-stopped
    user: "1000:1000"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/alloy.alloy:/etc/alloy/config.alloy:ro
      # Mount the Alloy home dir so remotecfg/storage can create subpaths as uid 1000
      - ${APP_DATA_DIR:-/var/lib/5tratumos/apps/cortex-monitoring}/data/alloy:/var/lib/alloy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      node-exporter:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
