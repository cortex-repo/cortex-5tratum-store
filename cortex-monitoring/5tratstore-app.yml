id: cortex-monitoring
name: Cortex Monitoring
tagline: Bundled Grafana observability with VictoriaMetrics, VictoriaLogs, and Alloy
description: >-
  Cortex Monitoring packages Grafana, VictoriaMetrics, VictoriaLogs, Grafana
  Alloy, Prometheus Node Exporter, and Alertmanager as one 5tratumOS app.
  Grafana is wired like the official 5tratStore GLOBAL grafana recipe
  (APP_HOST: app, no custom ROOT_URL). Initial login is admin with APP_PASSWORD
  when the OS provides one, otherwise admin/cortex. Password is also written to
  data/admin-password.txt under the app data root.
version: 1.0.5
category: Monitoring
developer: Cortex Monitoring recipe (upstream components retained)
website: https://grafana.com/oss/grafana/
repo: https://github.com/cortex-repo/cortex-5tratum-store
support: https://github.com/cortex-repo/cortex-5tratum-store/issues
icon: icon.png
port: 33040
path: /
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 3000
