id: cortex-monitoring
name: Cortex Monitoring
tagline: Grafana with VictoriaMetrics, logs, Alloy, and Node Exporter
description: >-
  Cortex Monitoring extends the official 5tratStore GLOBAL Grafana recipe with
  VictoriaMetrics, VictoriaLogs, Grafana Alloy, Node Exporter, and Alertmanager.
  Grafana keeps APP_HOST: app and port 33012. On first start it installs the
  VictoriaMetrics metrics and logs plugins, provisions VictoriaMetrics
  datasources, and loads the Node Exporter Full dashboard (Grafana.com id 1860).
  Victoria Exporter Full dashboard. Alloy mounts the Docker socket to ship all
  container logs into VictoriaLogs for Grafana Explore. Sign in as admin with
  the OS-generated APP_PASSWORD (fallback `cortex` if unset). The password is
  also written to `/var/lib/5tratumos/apps/cortex-monitoring/admin-password.txt`
  on start.
version: dev-0.0.4
category: Monitoring
developer: Grafana Labs and contributors
website: https://grafana.com/oss/grafana/
repo: https://github.com/grafana/grafana
support: https://github.com/cortex-repo/cortex-5tratum-store/issues
icon: https://raw.githubusercontent.com/grafana/grafana/v13.1.0/public/img/grafana_icon.svg
port: 33012
path: /
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 3000
