id: cortex-monitoring
name: Cortex Monitoring
tagline: Observability portal for Grafana, VictoriaMetrics, and logs
description: >-
  Cortex Monitoring installs a small Python portal as the 5tratumOS app front
  (port 8080). The portal lists Grafana, VictoriaMetrics, VictoriaLogs,
  Alertmanager, Alloy, and Node Exporter with links that open in a new browser
  tab. Grafana remains on port 3000 for direct access. Stack includes
  VictoriaMetrics plugins, Node Exporter Full dashboard (1860), and Docker log
  shipping to VictoriaLogs. Login for Grafana is admin with APP_PASSWORD
  (fallback cortex); also written to admin-password.txt.
version: dev-0.0.8
category: Monitoring
developer: Cortex Monitoring
website: https://github.com/cortex-repo/cortex-5tratum-store
repo: https://github.com/cortex-repo/cortex-5tratum-store
support: https://github.com/cortex-repo/cortex-5tratum-store/issues
icon: icon.png
port: 8080
path: /
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 8080
