apiVersion: 1

datasources:
  # Native VictoriaMetrics plugin (Explore / VM-specific queries)
  - name: VictoriaMetrics
    uid: victoria-metrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  # Prometheus API on the same VM backend — used by dashboard 1860 (Node Exporter Full)
  - name: VictoriaMetrics Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s

  - name: VictoriaLogs
    uid: victoria-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    isDefault: false
    editable: false
