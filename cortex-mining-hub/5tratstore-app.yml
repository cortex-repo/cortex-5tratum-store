id: cortex-mining-hub
name: Cortex Mining Hub
tagline: Fleet portal for Axe nodes, miners, and 5tratumOS
description: >-
  Cortex Mining Hub is a dark ops dashboard for the Cortex Hub PC. It shows
  Axe full-node health (sync, peers, latency, country), LAN miner hashrate,
  and 5tratumOS fleet KPIs. The store proxy opens the portal on port 8790.
  The container joins installed Axe node Docker networks so RPC stays
  internal. On first start it seeds nodes.json, mining.json, and portal.json
  under APP_DATA_DIR, then copies rpcuser, rpcpassword, and rpcport from each
  installed Axe node's conf. Re-scrape anytime from Settings. Fill 5tratumOS
  WebUI and miner credentials in Settings. This hub is a companion to
  5tratumOS and Axe node apps, not a replacement. Install the Axe node apps
  you want to monitor first so their Docker networks exist.
version: dev-0.1.12
category: Mining infrastructure
developer: Cortex Mining
website: https://cortexmining.com
repo: https://github.com/cortex-repo/cortex-mining
support: https://github.com/cortex-repo/cortex-mining/issues
icon: icon.png
gallery:
  - https://raw.githubusercontent.com/cortex-repo/cortex-5tratum-store/main/cortex-mining-hub/1.png
  - https://raw.githubusercontent.com/cortex-repo/cortex-5tratum-store/main/cortex-mining-hub/2.png
  - https://raw.githubusercontent.com/cortex-repo/cortex-5tratum-store/main/cortex-mining-hub/3.png
  - https://raw.githubusercontent.com/cortex-repo/cortex-5tratum-store/main/cortex-mining-hub/4.png
  - https://raw.githubusercontent.com/cortex-repo/cortex-5tratum-store/main/cortex-mining-hub/5.png
  - https://raw.githubusercontent.com/cortex-repo/cortex-5tratum-store/main/cortex-mining-hub/6.png
port: 8790
path: /
services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 8790
