services:
  app_proxy:
    environment:
      APP_HOST: app
      APP_PORT: 8790

  init:
    image: ghcr.io/cortex-repo/cortex-mining-hub:dev-0.1.12
    restart: "no"
    user: "0:0"
    command: ["/usr/local/bin/cortex-mining-init"]
    environment:
      DATA_DIR: /data
      NODES_FILE: /data/nodes.json
      STRATUMOS_APPS_DIR: /5tratumos-apps
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/..:/5tratumos-apps:ro
    security_opt:
      - no-new-privileges:true

  app:
    image: ghcr.io/cortex-repo/cortex-mining-hub:dev-0.1.12
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      NODES_FILE: /data/nodes.json
      PORTAL_FILE: /data/portal.json
      MINING_FILE: /data/mining.json
      STRATUMOS_APPS_DIR: /5tratumos-apps
      HOST_IP: ${HOST_IP:-${DEVICE_HOST_IP:-}}
    ports:
      - "8790:8790"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/..:/5tratumos-apps:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - axebch
      - axebtc
      - axedgb
      - axexec
      - axebc2
      - axebch2
      - axeppc
      - axefracattack
      - smack
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  axebch:
    external: true
    name: 5tratumos-axebch_default
  axebtc:
    external: true
    name: 5tratumos-axebtc_default
  axedgb:
    external: true
    name: 5tratumos-axedgb_default
  axexec:
    external: true
    name: 5tratumos-axexec_default
  axebc2:
    external: true
    name: 5tratumos-axebc2_default
  axebch2:
    external: true
    name: 5tratumos-axebch2_default
  axeppc:
    external: true
    name: 5tratumos-axeppc_default
  axefracattack:
    external: true
    name: 5tratumos-axefracattack_default
  smack:
    external: true
    name: 5tratumos-5tratsmack_chain
