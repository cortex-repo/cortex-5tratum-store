notes: >-
  First-party Cortex image from ghcr.io/cortex-repo/cortex-trading.
  No eToro keys, APP_SECRET, or .env are baked into the image. Init seeds
  APP_DATA_DIR (ledger, backtests) as uid 1000. Dashboard serves HTTP on
  8787 for the store proxy; worker runs `cortex run` against the same
  volume. LIVE stays disarmed until the operator sets keys and saves
  Target account LIVE in Config. Publish 8787 for direct access alongside app_proxy. Stop any
  standalone cortex-trading compose on 8787 before install.
